name: Publish image

on:
  push:
    tags:
      - "*.*-ts*.*"
  workflow_dispatch:
    inputs:
      postgres-version:
        description: PostgreSQL version (major.minor)
        required: true
        default: "17.11"
      timescaledb-version:
        description: TimescaleDB version (exact, major.minor.patch)
        required: true
        default: "2.31.0"
      base-variant:
        description: CloudNativePG base image variant (<flavor>-<debian codename>)
        required: true
        default: "standard-trixie"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: acaylor/cnpg-timescaledb
  # Base variant for tag-triggered builds. TimescaleDB 2.27+ has no Debian
  # bullseye packages, CloudNativePG's bare <version> tags are bullseye, and
  # its system images are deprecated in favour of standard + Barman Cloud plugin.
  DEFAULT_BASE_VARIANT: standard-trixie

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            image_tag="${{ inputs.postgres-version }}-ts${{ inputs.timescaledb-version }}"
            base_variant="${{ inputs.base-variant }}"
          else
            image_tag="${GITHUB_REF_NAME}"
            base_variant="${DEFAULT_BASE_VARIANT}"
          fi

          if [[ ! "$image_tag" =~ ^(([0-9]+)\.[0-9]+)-ts([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::'${image_tag}' does not match <pg major>.<pg minor>-ts<ts major>.<ts minor>.<ts patch>, e.g. 17.11-ts2.31.0"
            exit 1
          fi
          pg_version="${BASH_REMATCH[1]}"
          pg_major="${BASH_REMATCH[2]}"
          ts_version="${BASH_REMATCH[3]}"

          if [[ ! "$base_variant" =~ ^[a-z]+-[a-z]+$ ]]; then
            echo "::error::'${base_variant}' does not look like <flavor>-<debian codename>, e.g. standard-trixie"
            exit 1
          fi

          {
            echo "pg_version=${pg_version}"
            echo "pg_major=${pg_major}"
            echo "ts_version=${ts_version}"
            echo "base_variant=${base_variant}"
            echo "image_tag=${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PG_VERSION=${{ steps.versions.outputs.pg_version }}
            PG_BASE_VARIANT=${{ steps.versions.outputs.base_variant }}
            PG_MAJOR=${{ steps.versions.outputs.pg_major }}
            TIMESCALEDB_VERSION=${{ steps.versions.outputs.ts_version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.image_tag }}
