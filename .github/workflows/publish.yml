name: Publish image

on:
  push:
    tags:
      - "*.*-ts*.*"
  workflow_dispatch:
    inputs:
      postgres-version:
        description: PostgreSQL version
        required: true
        default: "17.4"
      timescaledb-version:
        description: TimescaleDB version
        required: true
        default: "2.17"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: acaylor/cnpg-timescaledb

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pg_version="${{ inputs.postgres-version }}"
            ts_version="${{ inputs.timescaledb-version }}"
          else
            tag="${GITHUB_REF_NAME}"
            pg_version="${tag%%-ts*}"
            ts_version="${tag#*-ts}"
          fi

          echo "pg_version=${pg_version}" >> "$GITHUB_OUTPUT"
          echo "pg_major=${pg_version%%.*}" >> "$GITHUB_OUTPUT"
          echo "ts_version=${ts_version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${pg_version}-ts${ts_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PG_VERSION=${{ steps.versions.outputs.pg_version }}
            PG_MAJOR=${{ steps.versions.outputs.pg_major }}
            TIMESCALEDB_VERSION=${{ steps.versions.outputs.ts_version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.image_tag }}
